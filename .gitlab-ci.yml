stages:
  - analyze
  - build
  - test
  - security
  - deploy

lint:
  stage: analyze
  allow_failure: true
  script:
    - npm ci --prefer-offline --no-audit
    - npm run lint -- --output-file lint-report.txt || LINT_STATUS=$?
    - cat lint-report.txt
    - exit ${LINT_STATUS:-0}
  artifacts:
    when: always
    paths:
      - lint-report.txt

build:
  stage: build
  script:
    - npm ci --prefer-offline --no-audit
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

unit-tests:
  stage: test
  script:
    - npm test

dependency-audit:
  stage: security
  script:
    - npm audit --omit=dev > audit-report.txt 2>&1 || true
    - cat audit-report.txt
    - npm audit --omit=dev --audit-level=critical
  artifacts:
    when: always
    paths:
      - audit-report.txt

secret-scan:
  stage: security
  script:
    - |
      if git grep -nIE -e '-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|glpat-[A-Za-z0-9_-]{20}|sk_live_[A-Za-z0-9]+' -- . ':!.gitlab-ci.yml' ':!package-lock.json'; then
        echo "Possible secret found. Failing the job."
        exit 1
      else
        echo "No secrets matched the patterns."
      fi

deploy:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "devsecops-pipeline"
  script:
    - find /var/www/election -mindepth 1 -delete
    - cp -a dist/. /var/www/election/
    - ls -l /var/www/election
    - curl -skfI https://localhost/
